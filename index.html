<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Check Độ Nhạy Free Fire</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-ff: #ff7700;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
            color: var(--accent-ff);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            margin: 0;
            font-size: 13px;
            color: var(--subtext-color);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 1. Phần chọn dòng điện thoại */
        .section-box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 119, 0, 0.3);
        }

        .label-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-ff);
            margin-bottom: 10px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: #080c14;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-ff);
        }

        /* 2. Nút Check Độ Nhạy */
        .btn-check {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff7700, #ff4400);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 119, 0, 0.4);
            transition: transform 0.1s;
        }

        .btn-check:active {
            transform: scale(0.98);
        }

        /* 3. Bảng hiện ra độ nhạy đã check */
        .result-box {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 119, 0, 0.5);
            display: none; /* Mặc định ẩn, bấm check mới hiện */
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .res-item {
            background-color: #080c14;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-ff);
        }

        .res-label {
            font-size: 11px;
            color: var(--subtext-color);
            text-transform: uppercase;
        }

        .res-val {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Free Fire Sensitivity Check</h1>
        <p>Chọn máy & Bấm check để nhận độ nhạy chuẩn (Max 200)</p>
    </div>

    <div class="container">
        
        <!-- 1. Phần chọn dòng điện thoại -->
        <div class="section-box">
            <span class="label-title">📱 1. Chọn hoặc nhập dòng điện thoại của bạn</span>
            <input type="text" id="phoneInput" list="phoneList" placeholder="VD: iPhone 13, Samsung A54, ROG Phone...">
            <datalist id="phoneList">
                <option value="iPhone 16 Pro Max">
                <option value="iPhone 15 Pro Max">
                <option value="iPhone 14 Pro Max">
                <option value="iPhone 13 / 13 Pro">
                <option value="iPhone 11 / 12">
                <option value="Samsung Galaxy S24 Ultra">
                <option value="Samsung Galaxy S23 / S22">
                <option value="Samsung Galaxy A54 / A55">
                <option value="Samsung Galaxy A32 / A14">
                <option value="Xiaomi 13 / 14 Ultra">
                <option value="Poco X5 Pro / X6 Pro">
                <option value="Redmi Note 12 / Note 13">
                <option value="OPPO Reno 10 / 11">
                <option value="ASUS ROG Phone 6 / 7 / 8">
                <option value="Nubia Red Magic 8 / 9">
            </datalist>
        </div>

        <!-- 2. Nút Check Độ Nhạy -->
        <button class="btn-check" onclick="checkSensitivity()">⚡ CHECK ĐỘ NHẠY NGAY</button>

        <!-- 3. Bảng hiện ra độ nhạy đã check -->
        <div class="result-box" id="resultBox">
            <span class="label-title" style="margin-bottom: 0;">🔥 Bảng Độ Nhạy Free Fire Chuẩn Nhất</span>
            <div class="result-grid">
                <div class="res-item">
                    <div class="res-label">Nhìn Xung Quanh</div>
                    <div class="res-val" id="ffGen">175</div>
                </div>
                <div class="res-item">
                    <div class="res-label">Red Dot Sight</div>
                    <div class="res-val" id="ffRed">180</div>
                </div>
                <div class="res-item">
                    <div class="res-label">Ống Ngắm 2X</div>
                    <div class="res-val" id="ff2x">165</div>
                </div>
                <div class="res-item">
                    <div class="res-label">Ống Ngắm 4X</div>
                    <div class="res-val" id="ff4x">145</div>
                </div>
                <div class="res-item">
                    <div class="res-label">Ống Ngắm Sniper</div>
                    <div class="res-val" id="ffSniper">110</div>
                </div>
                <div class="res-item">
                    <div class="res-label">Nút Bắn Khuyên Dùng</div>
                    <div class="res-val" id="ffBtn">45%</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function checkSensitivity() {
            const phoneName = document.getElementById('phoneInput').value.trim();
            
            if (!phoneName) {
                alert("Vui lòng nhập hoặc chọn tên điện thoại trước!");
                return;
            }

            let baseGen = 172;
            let baseRed = 178;
            let base2x = 162;
            let base4x = 142;
            let btnSize = 45;

            const nameLower = phoneName.toLowerCase();

            // Thuật toán tùy chỉnh theo dòng máy
            if (nameLower.includes('iphone')) {
                baseGen -= 8; // iOS mượt sẵn, giảm nhẹ chống văng tâm
                baseRed -= 5;
                btnSize = 42;
            } else if (nameLower.includes('rog') || nameLower.includes('red magic') || nameLower.includes('s24')) {
                baseGen -= 12; // Gaming phone siêu nhạy
                baseRed -= 10;
                btnSize = 40;
            } else if (nameLower.includes('a14') || nameLower.includes('c55') || nameLower.includes('redmi') || nameLower.includes('a32') || nameLower.includes('a54')) {
                baseGen = 194; // Máy giá rẻ/tầm trung đẩy cao độ nhạy để kéo tâm mượt hơn
                baseRed = 196;
                base2x = 182;
                base4x = 160;
                btnSize = 48;
            }

            const cap = (val) => Math.min(200, Math.max(0, Math.round(val)));

            // Hiển thị kết quả lên bảng
            document.getElementById('ffGen').innerText = cap(baseGen);
            document.getElementById('ffRed').innerText = cap(baseRed);
            document.getElementById('ff2x').innerText = cap(base2x);
            document.getElementById('ff4x').innerText = cap(base4x);
            document.getElementById('ffSniper').innerText = cap(110);
            document.getElementById('ffBtn').innerText = `${btnSize}%`;

            // Hiện bảng kết quả ra
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
